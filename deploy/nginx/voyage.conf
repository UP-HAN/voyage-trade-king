# 대항해 무역왕 — nginx location 조각 (docs/server-setup.md 1.5, PRD 10.9)
#
# ■ 넣는 위치
#   1) 이 파일을 서버의 /etc/nginx/snippets/voyage.conf 로 복사한다.
#   2) 사이트 설정(예: /etc/nginx/sites-available/<파일>)의 `listen 443 ssl` server 블록 안,
#      기존 `location /` **앞**에 아래 한 줄만 넣는다. 다른 줄은 바꾸지 않는다(먼저 백업).
#          include snippets/voyage.conf;
#   3) sudo nginx -t  → 통과할 때만 sudo systemctl reload nginx (실패하면 include 줄을 지우고 멈춤)
#   [교사 승인] 이 적용은 승인 지점 ⓒ-1이다. 서버 전체 설정(worker_connections 등)은 이 파일이 아니라
#   deploy/nginx/capacity.md(ⓒ-2, 별도 승인)에서 다룬다. 이 조각은 `location /`·events·worker_* 를 정의하지 않는다.
#
# ■ 경로를 바꾸는 법 (/voyage 가 아닌 다른 경로, 예: /game)
#   이 파일의 `/voyage` 5곳(location 이름)을 모두 바꾼다:
#     ① location = /voyage (와 return 301 의 /voyage/)  ② location ^~ /voyage/ (안쪽 중첩 location 2개의 /voyage/ 포함)
#     ③ location = /voyage/ws  ④ location = /voyage/health  ⑤ location = /voyage/notice
#   앱은 상대 경로로 빌드되어 있어 다시 빌드할 필요가 없다(중계 주소도 페이지 위치 기준 ./ws).
#
# ■ alias 주의
#   `alias` 값은 반드시 슬래시(/)로 끝나야 하고, location 이름(/voyage/)도 슬래시로 끝나야 한다.
#   둘 중 하나라도 빠지면 경로가 어긋나(/var/www/voyage/currentindex.html 등) 404가 나거나 다른 파일이 보일 수 있다.
#
# ■ 왜 ^~ 인가
#   기존 설정에 정규식 location(예: location ~* \.(js|css)$ { proxy_pass http://127.0.0.1:3000; })이 있어도
#   /voyage/ 아래 파일이 Next.js 쪽으로 가지 않게 한다. = 로 시작하는 정확히 일치 location(ws·health·notice)은
#   ^~ /voyage/ 보다 먼저 적용된다.
#
# ■ 캐시
#   - index.html·config.json(그 밖의 기본): no-cache — 배포 직후 새 버전, 운영자가 고친 config.json이 바로 반영
#   - static/ (Vite 빌드 해시 파일, vite.config.ts build.assetsDir = 'static'): 7일 + immutable
#   - assets/images/ (생성 이미지, 해시 없음): 1일
#   주의: location 안에 add_header가 있으면 server 블록의 add_header(예: HSTS)가 이 location에는 상속되지 않는다.
#         기존 server 블록에 add_header 줄이 있으면 아래 세 곳에도 같은 줄을 복사해 넣는다.

location = /voyage { return 301 /voyage/; }

location ^~ /voyage/ {
    alias /var/www/voyage/current/;
    index index.html;
    add_header Cache-Control "no-cache" always;

    # Vite 빌드 결과(이름에 해시가 붙음) — 길게 캐시
    location ^~ /voyage/static/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # 생성 이미지(이름에 해시 없음) — 1일
    location ^~ /voyage/assets/images/ {
        add_header Cache-Control "public, max-age=86400" always;
    }
}

location = /voyage/ws {
    proxy_pass http://127.0.0.1:8787/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location = /voyage/health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_set_header Host $host;
}

# 서버 공지(Cache-Control: no-store는 중계 서버가 붙인다)
location = /voyage/notice {
    proxy_pass http://127.0.0.1:8787/notice;
    proxy_set_header Host $host;
}
